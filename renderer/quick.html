<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #0b0e14; --panel: #12161f; --border: rgba(255,255,255,.08);
    --text: #e8eaf2; --dim: #8b93a7; --accent: #7a5cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100vh; border: 1px solid var(--border); border-radius: 12px; }

  header { padding: 10px 12px 6px; display: flex; align-items: center; gap: 8px; -webkit-app-region: drag; }
  header .t { font-size: 12.5px; font-weight: 600; flex: 1; }
  header button { -webkit-app-region: no-drag; }
  .chipbtn {
    background: var(--panel); border: 1px solid var(--border); color: var(--dim);
    font-size: 10.5px; border-radius: 999px; padding: 3px 10px; cursor: pointer;
  }
  .chipbtn:hover { color: var(--text); border-color: var(--accent); }

  #selText {
    margin: 4px 12px 8px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 11px; color: var(--dim);
    max-height: 54px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
  }

  .chips { display: flex; gap: 6px; padding: 0 12px 8px; flex-wrap: wrap; }
  .chip {
    background: rgba(122,92,255,.14); border: 1px solid rgba(122,92,255,.4);
    color: #cfc4ff; font-size: 11.5px; border-radius: 9px; padding: 6px 12px; cursor: pointer;
  }
  .chip:hover { background: rgba(122,92,255,.28); }

  #ask {
    margin: 0 12px 8px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 9px;
    color: var(--text); padding: 8px 11px; font-size: 12.5px; outline: none;
    font-family: inherit; resize: none; height: 34px;
  }
  #ask:focus { border-color: var(--accent); }

  #result {
    flex: 1; overflow-y: auto; padding: 4px 14px 10px; font-size: 12.5px; line-height: 1.55;
  }
  #result .placeholder { color: var(--dim); font-size: 11.5px; }

  footer { padding: 8px 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
  footer .hint { flex: 1; color: var(--dim); font-size: 10.5px; }
  footer button {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    font-size: 11.5px; border-radius: 8px; padding: 5px 12px; cursor: pointer;
  }
  footer button:hover { border-color: var(--accent); }
  #copyBtn.glow { border-color: var(--good); color: #a7f3d0; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }
</style>
</head>
<body>
  <header>
    <div class="t">✨ Orbit quick capture</div>
    <button class="chipbtn" id="closeBtn">Esc ✕</button>
  </header>
  <div id="selText">…</div>
  <div class="chips" id="chips"></div>
  <textarea id="ask" placeholder="…or ask anything about the selected text, then Enter"></textarea>
  <div id="result"><div class="placeholder">Pick an action — the answer streams here.</div></div>
  <footer>
    <span class="hint" id="stateHint"></span>
    <button id="copyBtn">⧉ Copy</button>
    <button id="againBtn">↺ Select again</button>
  </footer>
<script src="quick.js"></script>
</body>
</html>
