<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #0b0e14; --panel: #12161f; --panel2: #171c27;
    --border: rgba(255,255,255,.08); --text: #e8eaf2; --dim: #8b93a7;
    --accent: #7a5cff; --good: #34d399;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 12px; }

  header {
    padding: 12px 12px 8px;
    -webkit-app-region: drag;
    display: flex; align-items: center; gap: 8px;
  }
  header .t { font-size: 13px; font-weight: 600; flex: 1; }
  header button { -webkit-app-region: no-drag; }

  #search {
    margin: 0 12px 10px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 10px 13px;
    font-size: 13.5px;
    outline: none;
    font-family: inherit;
  }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(122,92,255,.15); }

  .chips { display: flex; gap: 6px; padding: 0 12px 10px; flex-wrap: wrap; }
  .chip {
    background: var(--panel2); border: 1px solid var(--border); color: var(--dim);
    font-size: 11px; border-radius: 999px; padding: 4px 12px; cursor: pointer;
    transition: all .12s;
  }
  .chip:hover { color: var(--text); }
  .chip.on { color: #cfc4ff; border-color: var(--accent); background: rgba(122,92,255,.14); }

  #list { flex: 1; overflow-y: auto; padding: 0 8px 10px; }
  .group { font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); padding: 10px 8px 4px; }
  .item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 9px; cursor: pointer; font-size: 12.5px;
    border: 1px solid transparent;
  }
  .item:hover, .item.hl { background: rgba(122,92,255,.12); border-color: rgba(122,92,255,.3); }
  .item .id { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item.current { background: rgba(52,211,153,.08); border-color: rgba(52,211,153,.25); }
  .item.current .id { color: #a7f3d0; }
  .tag { font-size: 9.5px; font-weight: 700; border-radius: 5px; padding: 2px 6px; letter-spacing: .4px; flex-shrink: 0; }
  .tag.free { background: rgba(52,211,153,.15); color: var(--good); border: 1px solid rgba(52,211,153,.35); }
  .tag.vision { background: rgba(122,92,255,.15); color: #c3b8ff; border: 1px solid rgba(122,92,255,.3); }
  .tag.cur { background: transparent; color: var(--good); }
  .empty { text-align: center; color: var(--dim); padding: 30px 20px; font-size: 12.5px; }

  footer { padding: 8px 12px; border-top: 1px solid var(--border); color: var(--dim); font-size: 10.5px; display: flex; gap: 12px; }
  kbd { background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 10px; }

  ::-webkit-scrollbar { width: 9px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 5px; border: 2px solid var(--bg); }
</style>
</head>
<body>
  <header>
    <div class="t">🔍 Pick a model</div>
    <button class="chip" id="closeBtn" title="Close">✕</button>
  </header>
  <input id="search" type="text" placeholder="Search models…  (e.g. llama, free, gpt, ocr)" autocomplete="off" />
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <footer><span><kbd>↑↓</kbd> navigate</span><span><kbd>Enter</kbd> select</span><span><kbd>Esc</kbd> close</span></footer>
  <script src="picker.js"></script>
</body>
</html>
