<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { background: transparent; overflow: hidden; width: 100%; height: 100%; }

  #orb {
    width: 52px;
    height: 52px;
    margin: 4px;
    border-radius: 16px;
    cursor: grab;
    position: relative;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.35), transparent 42%),
      radial-gradient(circle at 68% 78%, rgba(255,0,170,.55), transparent 55%),
      linear-gradient(135deg, #3d7bff 0%, #7a4dff 48%, #c44dff 100%);
    box-shadow:
      0 0 0 1.5px rgba(255,255,255,.22) inset,
      0 4px 18px rgba(110,77,255,.55),
      0 0 22px rgba(190,77,255,.35);
    transition: transform .15s ease, box-shadow .2s ease;
    animation: pulse 3.2s ease-in-out infinite;
  }
  #orb:hover { transform: scale(1.08); box-shadow: 0 0 0 1.5px rgba(255,255,255,.35) inset, 0 6px 26px rgba(110,77,255,.8), 0 0 34px rgba(190,77,255,.5); }
  #orb.dragging { cursor: grabbing; transform: scale(1.05); animation: none; }

  #orb svg { position: absolute; inset: 0; margin: auto; width: 24px; height: 24px; filter: drop-shadow(0 1px 3px rgba(0,0,0,.35)); }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 1.5px rgba(255,255,255,.22) inset, 0 4px 18px rgba(110,77,255,.5), 0 0 18px rgba(190,77,255,.3); }
    50% { box-shadow: 0 0 0 1.5px rgba(255,255,255,.28) inset, 0 4px 22px rgba(110,77,255,.7), 0 0 30px rgba(190,77,255,.5); }
  }

  /* --- appear / disappear / click animations --- */
  #orb.appear { animation: orb-in .5s cubic-bezier(.2,1.6,.35,1) both; }
  @keyframes orb-in {
    0%   { transform: scale(0) rotate(-160deg); opacity: 0; }
    55%  { transform: scale(1.22) rotate(10deg); opacity: 1; }
    78%  { transform: scale(.94) rotate(-4deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  #orb.disappear { animation: orb-out .26s cubic-bezier(.5,-0.4,.8,.4) both; }
  @keyframes orb-out {
    0%   { transform: scale(1) rotate(0); opacity: 1; }
    100% { transform: scale(0) rotate(150deg); opacity: 0; }
  }
  #orb.bounce { animation: orb-bounce .32s ease; }
  @keyframes orb-bounce {
    0% { transform: scale(1); }
    35% { transform: scale(.85, .78); }
    70% { transform: scale(1.14, 1.1); }
    100% { transform: scale(1); }
  }
  #ring {
    position: absolute; inset: 0;
    border-radius: 16px;
    pointer-events: none;
  }
  #ring.pop { animation: ring-pop .55s ease-out both; }
  @keyframes ring-pop {
    0% { box-shadow: 0 0 0 0 rgba(165, 105, 255, .75); }
    100% { box-shadow: 0 0 0 30px rgba(165, 105, 255, 0); }
  }
</style>
</head>
<body>
  <div id="orb" title="Orbit AI — drag to move, click to chat">
    <div id="ring"></div>
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2.5c.6 3.9 2.9 6.6 7.5 7.5v2c-4.6.9-6.9 3.6-7.5 7.5h-.1c-.6-3.9-2.9-6.6-7.4-7.5v-2c4.5-.9 6.8-3.6 7.4-7.5h.1z" fill="white" fill-opacity="0.95"/>
      <circle cx="18.6" cy="5.4" r="1.6" fill="white" fill-opacity="0.85"/>
    </svg>
  </div>
<script>
  const orb = document.getElementById('orb');
  const api = window.orbitOverlay;
  let dragging = false;
  let movedTotal = 0;
  let pendingDx = 0, pendingDy = 0;
  let rafId = null;

  orb.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    api.menu();
  });

  orb.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    dragging = true;
    movedTotal = 0;
    orb.classList.add('dragging');
    try { orb.setPointerCapture(e.pointerId); } catch {}
    api.dragStart();
  });

  orb.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    pendingDx += e.movementX || 0;
    pendingDy += e.movementY || 0;
    if (!rafId) {
      rafId = requestAnimationFrame(() => {
        rafId = null;
        if (!dragging || (pendingDx === 0 && pendingDy === 0)) return;
        movedTotal += Math.abs(pendingDx) + Math.abs(pendingDy);
        api.dragDelta(pendingDx, pendingDy);
        pendingDx = 0; pendingDy = 0;
      });
    }
  });

  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    orb.classList.remove('dragging');
    if (movedTotal < 6) {
      orb.classList.add('bounce');
      setTimeout(() => orb.classList.remove('bounce'), 340);
    }
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    // flush any pending movement so the final position registers
    if (pendingDx !== 0 || pendingDy !== 0) {
      movedTotal += Math.abs(pendingDx) + Math.abs(pendingDy);
      api.dragDelta(pendingDx, pendingDy);
      pendingDx = 0; pendingDy = 0;
    }
    api.dragEnd();
  }
  orb.addEventListener('pointerup', endDrag);
  orb.addEventListener('pointercancel', endDrag);

  /* --- animations: appear on load, in/out via main process, bounce on click --- */
  const ring = document.getElementById('ring');
  function playAppear() {
    orb.classList.remove('disappear', 'appear');
    void orb.offsetWidth;
    orb.classList.add('appear');
    ring.classList.remove('pop');
    void ring.offsetWidth;
    ring.classList.add('pop');
  }
  function playDisappear() {
    orb.classList.remove('appear');
    void orb.offsetWidth;
    orb.classList.add('disappear');
  }
  api.onAnim((mode) => {
    if (mode === 'in') playAppear();
    else if (mode === 'out') playDisappear();
  });
  window.addEventListener('load', playAppear);
</script>
</body>
</html>
