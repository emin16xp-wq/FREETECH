<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; pointer-events: none; }

  /* the AI cursor halo */
  #halo {
    position: absolute; left: 0; top: 0;
    width: 34px; height: 34px; margin: -17px 0 0 -17px;
    border-radius: 50%;
    border: 2.5px solid rgba(122, 92, 255, .95);
    background: rgba(122, 92, 255, .14);
    box-shadow: 0 0 14px 3px rgba(122, 92, 255, .55), inset 0 0 8px rgba(122, 92, 255, .35);
    opacity: 0;
    transition: opacity .35s ease;
    will-change: transform;
    z-index: 5;
  }
  #halo.on { opacity: 1; }
  #halo.pressed { border-color: rgba(52, 211, 153, .95); background: rgba(52, 211, 153, .18); box-shadow: 0 0 16px 4px rgba(52, 211, 153, .6); }
  #dot {
    position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%; background: #fff; box-shadow: 0 0 6px rgba(255,255,255,.9);
  }
  #tag {
    position: absolute; left: 22px; top: 20px;
    font: 600 9.5px 'Segoe UI', sans-serif; letter-spacing: 1.2px;
    color: #fff; background: rgba(122, 92, 255, .85);
    padding: 2px 7px; border-radius: 8px; white-space: nowrap;
    text-transform: uppercase;
  }

  /* click ripples */
  .ripple {
    position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border-radius: 50%; border: 2.5px solid rgba(122, 92, 255, .9);
    animation: rip .55s ease-out forwards; z-index: 4;
  }
  .ripple.green { border-color: rgba(52, 211, 153, .9); }
  .ripple.ghost { border-style: dashed; border-color: rgba(52, 211, 153, .95); }
  @keyframes rip {
    from { transform: scale(.6); opacity: 1; }
    to { transform: scale(4.2); opacity: 0; }
  }

  /* action toast (key presses, typing) */
  .toast {
    position: absolute; transform: translate(-50%, -190%);
    font: 600 11px 'Segoe UI', sans-serif; color: #fff;
    background: rgba(18, 22, 31, .92); border: 1px solid rgba(122, 92, 255, .5);
    padding: 4px 10px; border-radius: 9px; white-space: nowrap;
    animation: toast 1.5s ease forwards; z-index: 6;
  }
  @keyframes toast {
    0% { opacity: 0; margin-top: 6px; }
    12% { opacity: 1; margin-top: 0; }
    75% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
  <div id="halo"><div id="dot"></div><div id="tag">Orbit</div></div>
<script>
  const halo = document.getElementById('halo');
  const tag = document.getElementById('tag');
  let cur = { x: innerWidth / 2, y: innerHeight / 2 };
  let target = { ...cur };
  let anim = null;
  let fadeTimer = null;

  function place(p) {
    halo.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px)';
  }
  place(cur);

  function wake() {
    halo.classList.add('on');
    clearTimeout(fadeTimer);
    fadeTimer = setTimeout(() => halo.classList.remove('on'), 2600);
  }

  // glide toward a target with smoothstep easing (mirrors the real mouse glide)
  function glideTo(x, y, ms, done) {
    target = { x, y };
    const from = { ...cur };
    const t0 = performance.now();
    cancelAnimationFrame(anim);
    const step = (now) => {
      const t = Math.min(1, (now - t0) / ms);
      const e = t * t * (3 - 2 * t);
      cur = { x: from.x + (x - from.x) * e, y: from.y + (y - from.y) * e };
      place(cur);
      if (t < 1) anim = requestAnimationFrame(step);
      else if (done) done();
    };
    anim = requestAnimationFrame(step);
  }

  function ripple(x, y, green) {
    const r = document.createElement('div');
    r.className = 'ripple' + (green ? ' green' : '');
    r.style.left = x + 'px';
    r.style.top = y + 'px';
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 620);
  }

  function toast(text) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    t.style.left = cur.x + 'px';
    t.style.top = cur.y + 'px';
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 1550);
  }

  window.pcPointer.onPointer((ev) => {
    wake();
    if (ev.kind === 'move' && ev.x != null) {
      glideTo(ev.x, ev.y, 380);
    } else if (ev.kind === 'drag') {
      halo.classList.add('pressed');
      glideTo(ev.fromX, ev.fromY, 320, () => {
        setTimeout(() => glideTo(ev.toX, ev.toY, 700, () => halo.classList.remove('pressed')), 160);
      });
    } else if (ev.kind === 'click') {
      const run = () => {
        if (ev.ghost) {
          // virtual click: show a dashed green ripple at the target — the real cursor never moved
          const r = document.createElement('div');
          r.className = 'ripple ghost';
          r.style.left = cur.x + 'px';
          r.style.top = cur.y + 'px';
          document.body.appendChild(r);
          setTimeout(() => r.remove(), 620);
          toast('👻 virtual click');
        } else {
          ripple(cur.x, cur.y, false);
          if (ev.double) setTimeout(() => ripple(cur.x, cur.y, false), 130);
          halo.classList.add('pressed');
          setTimeout(() => halo.classList.remove('pressed'), 240);
        }
      };
      if (ev.x != null) glideTo(ev.x, ev.y, 300, run);
      else run();
    } else if (ev.kind === 'key') {
      toast((ev.ghost ? '👻 ' : '⌨ ') + String(ev.combo || 'key').slice(0, 24));
    } else if (ev.kind === 'type') {
      toast('⌨ typing…');
    }
  });
</script>
</body>
</html>
